name: 自用构建 ARM64 APK
run-name: 自用构建 ARM64 APK ${{ github.ref_name }}

on:
  workflow_dispatch: {}

concurrency:
  group: self-apk-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  Build_APK:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: 释放 Android 构建所需磁盘空间
        run: rm -rf /opt/hostedtoolcache

      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version-file: pubspec.yaml
          architecture: x64
          cache: true

      # 首次构建自动生成自用签名密钥，并缓存到 Actions 缓存，
      # 之后每次构建复用同一密钥，保证覆盖升级安装不报签名冲突。
      - name: 恢复自用签名密钥
        uses: actions/cache@v4
        id: keystore-cache
        with:
          path: android/keystore.jks
          key: venera-self-keystore-v1

      - name: 生成自用签名密钥（仅首次缓存未命中时）
        if: steps.keystore-cache.outputs.cache-hit != 'true'
        run: |
          keytool -genkeypair -v \
            -keystore android/keystore.jks \
            -alias release \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=Self Use, OU=Self Use, O=Self Use, L=Local, S=Local, C=CN"

      - name: 写入签名配置
        run: |
          cat > android/key.properties <<'EOF'
          storePassword=android
          keyPassword=android
          keyAlias=release
          storeFile=../android/keystore.jks
          EOF

      - uses: actions/setup-java@v6
        with:
          distribution: 'oracle'
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            android/**/*.gradle*
            android/gradle/wrapper/gradle-wrapper.properties
            pubspec.lock

      - name: 准备 Rust 工具链
        run: |
          python3 .github/scripts/prepare_rust_toolchain.py \
            --target aarch64-linux-android \
            --target armv7-linux-androideabi \
            --target x86_64-linux-android

      - name: 配置 Gradle 插件仓库
        run: |
          mkdir -p ~/.gradle/init.d
          cat > ~/.gradle/init.d/plugin-repositories.gradle <<'EOF'
          settingsEvaluated { settings ->
              settings.pluginManagement.repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          EOF

      - run: flutter pub get --enforce-lockfile

      - name: 构建 release APK
        run: flutter build apk --release

      - name: 上传 APK (arm64-v8a)
        uses: actions/upload-artifact@v7
        with:
          name: apk-arm64-v8a
          path: build/app/outputs/apk/release/*arm64-v8a*.apk
          if-no-files-found: error
          retention-days: 30
